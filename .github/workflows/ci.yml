name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core is where the transform math and wire protocol live, and it is
  # deliberately free of platform APIs so it can be tested on the cheapest runner
  # available. This job is the one that gates merges.
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  # Placeholder. Enable once windows/ has something to build; the Windows client
  # cannot be cross-compiled from the Linux dev box, so this job is the only way the
  # D3D11 and Media Foundation code gets compiled at all.
  windows-client:
    name: windows client
    runs-on: windows-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO: Qt 6 + MSVC build of windows/"

  # Placeholder. Enable once ios/ exists. Builds only -- the simulator has no camera,
  # so capture is verified on device by hand.
  ios-app:
    name: ios app
    runs-on: macos-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO: xcodebuild of ios/RemoteCam"
